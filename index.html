<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INOVE 3D LAB — Controle Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0C0C0D;
    --panel:#19191A;
    --panel-alt:#222222;
    --gold:#C9A227;
    --gold-bright:#E7C25E;
    --gold-dim: rgba(201,162,39,0.25);
    --ink:#F3EFE4;
    --ink-soft:#A9A395;
    --ink-faint:#6E695D;
    --line:#2E2C27;
    --red:#C1594B;
    --red-bg: rgba(193,89,75,0.12);
    --blue:#5B8DBE;
    --blue-bg: rgba(91,141,190,0.14);
    --green:#4C9A5B;
    --green-bg: rgba(76,154,91,0.16);
    --amber:#C9A227;
    --amber-bg: rgba(201,162,39,0.1);
    --sans:'Inter', system-ui, sans-serif;
    --display:'Cormorant Garamond', Georgia, serif;
    --mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  #app{min-height:100vh;padding-bottom:60px;}

  .ruler{
    height:1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim) 15%, var(--gold) 50%, var(--gold-dim) 85%, transparent);
    opacity:.8;
  }

  header.top{
    background: var(--panel);
    border-bottom:1px solid var(--line);
    padding: 20px clamp(16px,4vw,48px) 20px;
    position:relative;
  }
  .header-row{display:flex; justify-content:flex-start; align-items:center; gap:6px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:18px; position:relative; z-index:1; padding:4px 26px 4px 20px; margin-left:6px;}
  .brand::before{
    content:"";
    position:absolute;
    left:-3000px; right:calc(100% - 52px); top:-18px; bottom:-18px;
    background:#000;
    border-right:1px solid var(--gold-dim);
    z-index:-1;
  }
  .brand .logo{
    width:64px; height:64px; border-radius:50%; object-fit:cover;
    border:1px solid var(--gold-dim);
    box-shadow: 0 0 0 4px var(--bg), 0 0 0 5px var(--gold-dim);
    background:#000;
  }
  .brand .txt{display:flex; flex-direction:column; gap:4px;}
  .brand .sub{
    font-family:var(--mono); font-size:10.5px; letter-spacing:2.5px; text-transform:uppercase;
    color:var(--ink-faint);
  }
  header.top .ruler{margin-top:16px;}

  .menu-wrap{position:relative; z-index:5;}
  .hamburger{
    background:var(--panel-alt); border:1px solid var(--line); color:var(--gold-bright);
    font-size:18px; padding:10px 14px; border-radius:4px; cursor:pointer; line-height:1;
  }
  .hamburger:hover{border-color:var(--gold-dim);}
  .nav-menu{
    position:absolute; top:calc(100% + 8px); left:0; background:var(--panel);
    border:1px solid var(--gold-dim); border-radius:6px; padding:6px; min-width:240px;
    z-index:70; display:none; box-shadow:0 14px 34px rgba(0,0,0,0.55);
  }
  .nav-menu.open{display:block;}
  .nav-item{
    display:block; width:100%; text-align:left; background:none; border:none;
    color:var(--ink-soft); padding:11px 14px; border-radius:4px; cursor:pointer;
    font-family:var(--sans); font-size:14px; font-weight:500; text-decoration:none; box-sizing:border-box;
  }
  .nav-item:hover{background:var(--panel-alt); color:var(--ink);}
  .nav-item.active{color:var(--gold-bright); background:var(--gold-dim); font-weight:600;}

  main{
    max-width:1800px; margin:0 auto; padding: 28px clamp(16px,3vw,56px) 0;
  }

  .page-title{margin-bottom:22px;}
  .page-title h1{font-family:var(--display); font-size:27px; margin:0 0 6px; color:var(--ink); font-weight:700;}
  .page-title p{font-size:13.5px; color:var(--ink-faint); margin:0; max-width:580px; line-height:1.5;}

  /* ---------- barra de mês ---------- */
  .month-bar{
    display:flex; align-items:center; gap:10px; margin-bottom:20px;
  }
  .month-arrow{
    background:var(--panel); border:1px solid var(--line); color:var(--gold-bright);
    font-size:16px; padding:9px 14px; border-radius:4px; cursor:pointer; font-family:var(--mono);
    line-height:1;
  }
  .month-arrow:hover{border-color:var(--gold-dim);}
  .month-input-wrap{position:relative;}
  .month-label-btn{
    font-family:var(--display); font-weight:700; font-size:18px; letter-spacing:.3px;
    background:var(--panel); border:1px solid var(--line); color:var(--ink);
    padding:9px 18px; border-radius:4px; cursor:pointer; text-transform:capitalize;
    min-width:170px; text-align:center;
  }
  .month-label-btn:hover{border-color:var(--gold-dim);}
  #monthPicker{
    position:absolute; inset:0; opacity:0; width:100%; height:100%; border:none; cursor:pointer;
  }
  .vencimento-badge{
    font-family:var(--mono); font-size:11.5px; letter-spacing:.4px;
    background:var(--panel-alt); border:1px solid var(--gold-dim); border-radius:4px;
    padding:9px 14px; color:var(--ink-soft); display:flex; align-items:center; gap:6px;
  }
  .vencimento-badge b{color:var(--gold-bright); font-weight:700;}
  .vencimento-badge input[type=date]{
    background:var(--panel); border:1px solid var(--line); border-radius:3px;
    color:var(--gold-bright); font-family:var(--mono); font-size:11.5px; padding:4px 6px; margin:0 4px;
  }

  /* ---------- painel de resumo / gráfico ---------- */
  .summary-panel{
    background:var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:20px clamp(16px,3vw,26px); margin-bottom:24px;
    display:grid; grid-template-columns: auto 1fr; gap:28px; align-items:center;
  }
  .donut-block{display:flex; align-items:center; gap:18px;}
  .donut-block svg{display:block; animation: donutPop .55s cubic-bezier(.2,.8,.3,1.15) both;}
  .donut-arc{transition: stroke-dasharray 1s cubic-bezier(.16,.84,.44,1);}
  .donut-pct-text{animation: fadeInUp .5s ease-out .25s both;}
  .donut-legend{font-family:var(--mono); font-size:15px; line-height:2.3; font-weight:700;}
  .donut-legend .legend-line{opacity:0; animation: fadeInUp .5s ease-out forwards;}
  .donut-legend .legend-line.recebido{color:var(--green); text-shadow:0 0 10px rgba(76,154,91,0.55); animation-delay:.15s;}
  .donut-legend .legend-line.receber{color:var(--red); text-shadow:0 0 10px rgba(193,89,75,0.45); animation-delay:.3s;}
  .donut-legend .dot{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px;}
  .donut-legend .dot.green{background:var(--green); box-shadow:0 0 9px var(--green);}
  .donut-legend .dot.red{background:var(--red); box-shadow:0 0 9px var(--red);}
  .donut-legend .amt{font-weight:700; margin-left:5px; opacity:.92;}
  .counters{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:14px;
  }
  .counter{
    text-align:center; border-left:1px solid var(--line); padding-left:14px;
    opacity:0; animation: fadeInUp .45s ease-out forwards;
  }
  .counter:nth-child(1){animation-delay:.05s;}
  .counter:nth-child(2){animation-delay:.12s;}
  .counter:nth-child(3){animation-delay:.19s;}
  .counter:nth-child(4){animation-delay:.26s;}
  .counter:nth-child(5){animation-delay:.33s;}
  .counter:first-child{border-left:none; padding-left:0;}
  .counter .cnum{font-family:var(--display); font-weight:700; font-size:clamp(20px,2.2vw,26px); color:var(--gold-bright);}
  .counter.faltam .cnum{color:var(--red);}
  .counter .clabel{font-family:var(--mono); font-size:9.5px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-faint); margin-top:4px;}
  @keyframes fadeInUp{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes donutPop{
    from{opacity:0; transform:scale(.85);}
    to{opacity:1; transform:scale(1);}
  }
  @media (max-width:640px){
    .summary-panel{grid-template-columns:1fr;}
    .donut-block{justify-content:center;}
  }

  /* ---------- ranking de clientes por valor ---------- */
  .ranking-panel{
    background:var(--panel); border:1px solid var(--line); border-radius:4px;
    margin-bottom:24px; overflow:hidden;
  }
  .ranking-toggle{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    background:none; border:none; cursor:pointer; padding:13px 18px;
    font-family:var(--mono); font-size:11px; letter-spacing:1.3px; text-transform:uppercase; color:var(--ink-soft);
  }
  .ranking-toggle:hover{color:var(--ink);}
  .ranking-toggle .chevron{color:var(--ink-faint); font-size:10px;}
  .ranking-list{padding:0 18px 14px;}

  .rank-cards-row{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px;
    padding:0 18px 14px;
  }
  .rank-card{
    background:var(--panel-alt); border:1px solid var(--line); border-radius:6px; padding:16px;
  }
  .rank-card .rc-place{font-family:var(--mono); font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-faint);}
  .rank-card .rc-place .medal{font-size:16px; margin-right:5px;}
  .rank-card .rc-name{font-family:var(--display); font-weight:700; font-size:16px; color:var(--ink); margin-top:9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rank-card .rc-value{font-family:var(--mono); font-weight:700; font-size:21px; color:var(--gold-bright); margin-top:4px;}
  .rank-card .rc-sub{font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); margin-top:4px;}

  .two-col-rank{display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:0 18px 16px;}
  @media (max-width:700px){ .two-col-rank{grid-template-columns:1fr;} }
  .rank-col-title{
    font-family:var(--mono); font-size:11px; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:10px; display:flex; align-items:center; gap:6px;
  }
  .rank-col-box{background:var(--panel-alt); border:1px solid var(--line); border-radius:6px; padding:6px 14px;}
  .rank-mini-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 0; border-bottom:1px dashed var(--line);
  }
  .rank-mini-row:last-child{border-bottom:none;}
  .rank-mini-left{display:flex; align-items:center; gap:10px; min-width:0;}
  .rank-mini-pos{width:18px; text-align:center; font-family:var(--mono); font-size:12px; color:var(--ink-faint); flex-shrink:0;}
  .rank-mini-name{font-family:var(--display); font-weight:700; font-size:13.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rank-mini-sub{font-family:var(--mono); font-size:10px; color:var(--ink-faint); margin-top:2px;}
  .rank-mini-badge{
    font-family:var(--mono); font-size:10px; font-weight:700; padding:4px 8px; border-radius:3px; white-space:nowrap; flex-shrink:0;
  }
  .rank-mini-badge.green{background:var(--green-bg); color:#8FDA9E; border:1px solid var(--green);}
  .rank-mini-badge.red{background:var(--red-bg); color:var(--red); border:1px solid var(--red);}
  .rank-row{
    display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px dashed var(--line);
  }
  .rank-row:last-child{border-bottom:none;}
  .rank-pos{
    width:26px; text-align:center; font-family:var(--mono); font-size:13px; font-weight:700; color:var(--ink-faint); flex-shrink:0;
  }
  .rank-pos.medal{font-size:17px;}
  .rank-avatar{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-weight:700; font-size:11px; color:#151300;
  }
  .rank-name{font-family:var(--display); font-weight:700; font-size:14.5px; color:var(--ink); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rank-value{font-family:var(--mono); font-weight:700; font-size:13px; color:var(--gold-bright); flex-shrink:0;}
  .rank-empty{color:var(--ink-faint); font-size:13px; padding:8px 0;}

  /* ---------- visualização em planilha ---------- */
  .stat-row{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:12px; margin-bottom:20px;
  }
  .stat-card{
    background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:14px 16px;
  }
  .stat-card .label{font-family:var(--mono); font-size:9.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-faint);}
  .stat-card .value{font-family:var(--display); font-weight:700; font-size:clamp(18px,2vw,22px); margin-top:5px; color:var(--ink);}
  .stat-card.receber .value{color:var(--red);}
  .stat-card.pago .value{color:var(--gold-bright);}
  .stat-card.pct .value{color:var(--blue);}

  .table-wrap{
    background:var(--panel); border:1px solid var(--line); border-radius:6px; overflow-x:auto;
  }
  .data-table{width:100%; border-collapse:collapse; min-width:820px;}
  .data-table thead th{
    text-align:left; font-family:var(--mono); font-size:10px; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--ink-faint); padding:12px 16px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  .data-table tbody td{
    padding:13px 16px; border-bottom:1px solid var(--line); font-size:13.5px; color:var(--ink-soft); vertical-align:middle;
  }
  .data-table tbody tr:last-child td{border-bottom:none;}
  .data-table tbody tr:hover{background:var(--panel-alt);}
  .data-table tbody tr.row-quitado{background: rgba(76,154,91,0.07);}
  .data-table tbody tr.row-quitado:hover{background: rgba(76,154,91,0.13);}
  .data-table .cell-cliente{display:flex; align-items:center; gap:10px;}
  .data-table .cell-name{font-family:var(--display); font-weight:700; font-size:14.5px; color:var(--ink); white-space:nowrap;}
  .data-table .cell-mono{font-family:var(--mono); font-size:13px; color:var(--ink-soft); white-space:nowrap;}
  .data-table .cell-obs{color:var(--ink-faint); font-size:12.5px; font-style:italic; max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .table-empty{padding:50px 20px; text-align:center; color:var(--ink-faint);}

  .toolbar{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px;
  }
  .toolbar input[type=search]{
    flex:1; min-width:180px; padding:11px 14px; border-radius:4px; border:1px solid var(--line);
    font-family:var(--sans); font-size:14px; background:var(--panel); color:var(--ink);
  }
  .toolbar input[type=search]::placeholder{color:var(--ink-faint);}
  .tabs{display:flex; gap:6px; flex-wrap:wrap;}
  .pane-list .tabs{flex-wrap:nowrap; overflow-x:auto; -ms-overflow-style:none; scrollbar-width:none; padding-bottom:2px;}
  .pane-list .tabs::-webkit-scrollbar{display:none;}
  .tab{
    font-family:var(--mono); font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase;
    padding:8px 13px; border-radius:3px; border:1px solid var(--line); background:var(--panel);
    color:var(--ink-soft); cursor:pointer; white-space:nowrap;
  }
  .pane-list .tab{padding:7px 9px; font-size:9.5px; letter-spacing:1px;}
  .tab.active{background:var(--gold); border-color:var(--gold); color:#151300;}
  .btn{
    font-family:var(--sans); font-weight:600; font-size:14px;
    padding:11px 18px; border-radius:4px; border:1px solid var(--gold); cursor:pointer;
    background:var(--gold); color:#151300; letter-spacing:.2px;
  }
  .btn:hover{background:var(--gold-bright); border-color:var(--gold-bright);}
  .btn.ghost{background:transparent; color:var(--gold-bright); border:1px solid var(--gold-dim);}
  .btn.ghost:hover{border-color:var(--gold);}
  .btn.danger{background:transparent; color:var(--red); border:1px solid var(--red);}
  .btn.danger:hover{background:var(--red-bg);}
  .btn.small{padding:8px 13px; font-size:13px;}

  /* ---------- layout de duas colunas: lista + detalhe ---------- */
  .two-pane{display:grid; grid-template-columns: minmax(300px, 0.85fr) minmax(380px, 1.15fr); gap:16px; align-items:start;}
  .pane-list .toolbar{margin-bottom:10px;}
  .mini-list{display:flex; flex-direction:column; gap:8px; max-height:66vh; overflow-y:auto; padding-right:2px;}
  .mini-row{
    background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:10px 12px;
    display:flex; flex-direction:column; gap:9px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .mini-row:hover{border-color:var(--gold-dim);}
  .mini-row.selected{border-color:var(--gold); background:var(--panel-alt);}
  .mini-row-top{display:flex; align-items:center; gap:11px;}
  .mini-atraso{
    font-family:var(--mono); font-size:10px; font-weight:700; color:var(--red);
    background:var(--red-bg); border:1px solid var(--red); border-radius:3px;
    padding:4px 8px; white-space:nowrap; flex-shrink:0; align-self:flex-start;
  }
  .mini-avatar{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-weight:700; font-size:13px; color:#151300;
  }
  .mini-info{min-width:0; flex:1;}
  .mini-name{font-family:var(--display); font-weight:700; font-size:15px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mini-sub{font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mini-values-row{
    display:flex; justify-content:space-between; gap:8px;
    font-family:var(--mono); font-size:10.5px; color:var(--ink-faint);
    padding-top:8px; border-top:1px dashed var(--line);
  }
  .mini-values-row b{font-weight:600;}
  .mini-badges{display:flex; gap:5px; margin-top:7px; flex-wrap:wrap;}
  .mini-badge{
    font-family:var(--mono); font-size:9px; letter-spacing:.4px; text-transform:uppercase;
    padding:3px 7px; border-radius:3px; background:var(--panel-alt); color:var(--ink-faint); border:1px solid var(--line);
  }
  .mini-badge.on{background:var(--green-bg); color:#8FDA9E; border-color:var(--green);}
  .mini-badge.on-blue{background:var(--blue-bg); color:var(--blue); border-color:var(--blue);}

  .detail-panel{
    background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:22px clamp(16px,3vw,26px);
  }
  .detail-header{display:flex; align-items:center; gap:14px;}
  .detail-avatar{
    width:54px; height:54px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-weight:700; font-size:19px; color:#151300;
  }
  .detail-name{font-family:var(--display); font-weight:700; font-size:22px; color:var(--ink);}
  .detail-sub{font-family:var(--mono); font-size:11px; color:var(--ink-faint); margin-top:3px;}
  .detail-empty{text-align:center; padding:60px 20px; color:var(--ink-faint);}
  .atraso-badge{
    font-family:var(--mono); font-size:10.5px; font-weight:700; color:var(--red);
    background:var(--red-bg); border:1px solid var(--red); border-radius:3px;
    padding:5px 9px; white-space:nowrap;
  }
  .extrato-row-detail{
    margin-top:16px; display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--panel-alt); border:1px solid var(--line); border-radius:4px; padding:12px 14px;
  }
  .extrato-row-detail .txt{font-size:13px; color:var(--ink-soft);}
  .extrato-row-detail .txt b{color:var(--ink);}

  .lock-row{display:flex; justify-content:flex-end; margin-top:-6px; margin-bottom:8px;}

  .quick-actions{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 4px;}
  .qa-btn{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.4px; font-weight:600;
    padding:9px 13px; border-radius:4px; border:1px solid var(--line); background:var(--panel-alt);
    color:var(--ink-soft); cursor:pointer;
  }
  .qa-btn:hover{border-color:var(--gold-dim); color:var(--ink);}
  .qa-btn.active{background:var(--gold-dim); border-color:var(--gold); color:var(--gold-bright);}
  .qa-btn.active-green{background:var(--green-bg); border-color:var(--green); color:#8FDA9E;}
  .qa-btn:disabled{opacity:.4; cursor:not-allowed;}

  .section-label{
    font-family:var(--mono); font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-faint);
    margin:22px 0 10px; display:flex; justify-content:space-between; align-items:center; gap:10px;
  }

  .pagamentos-list{display:flex; flex-direction:column;}
  .pagamento-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-bottom:1px dashed var(--line); font-size:13.5px;
  }
  .pagamento-row:last-child{border-bottom:none;}
  .pagamento-row .val{font-family:var(--mono); font-weight:700; color:var(--gold-bright);}
  .pagamento-row .d{color:var(--ink-faint); font-size:12px; margin-top:2px;}
  .pagamento-row button{background:none; border:none; color:var(--red); cursor:pointer; font-size:12px; font-family:var(--mono);}
  .empty-hist{color:var(--ink-faint); font-size:13px; padding:4px 0;}
  @media (max-width:860px){
    .two-pane{grid-template-columns:1fr;}
    .mini-list{max-height:none;}
  }

  .list-header{
    display:grid; grid-template-columns: 1.1fr 1.3fr 1fr 0.95fr auto;
    gap:14px; padding:0 18px 9px; margin-bottom:2px; border-bottom:1px solid var(--line);
    font-family:var(--mono); font-size:10px; letter-spacing:1.3px; text-transform:uppercase; color:var(--ink-faint);
  }

  .client{
    background:var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:16px 18px; margin-bottom:9px; cursor:pointer;
    display:grid; grid-template-columns: 1.1fr 1.3fr 1fr 0.95fr auto; gap:14px; align-items:center;
    transition:border-color .15s;
  }
  .client:hover{border-color:var(--gold-dim);}
  .client .name{font-family:var(--display); font-weight:700; font-size:19px; color:var(--ink);}
  .client .nums{font-family:var(--mono); font-size:12px; color:var(--ink-soft); line-height:1.8;}
  .client .nums b{color:var(--ink); font-weight:600;}
  .client .obs-text{font-size:13px; color:var(--ink-soft); font-style:italic; line-height:1.4;}
  .client .obs-text.empty{color:var(--ink-faint); font-style:normal;}
  .col-label{display:none;}
  .stamp{
    font-family:var(--mono); font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
    padding:5px 10px; border-radius:3px; border:1px solid; display:inline-block; font-weight:700;
  }
  .stamp.quitado{color:var(--gold-bright); border-color:var(--gold); background:var(--gold-dim);}
  .stamp.parcial{color:var(--ink); border-color:var(--ink-faint); background:var(--panel-alt);}
  .stamp.pendente{color:var(--red); border-color:var(--red); background:var(--red-bg);}

  .col-extrato{text-align:center;}
  .extrato-btn{
    font-family:var(--mono); font-size:11px; letter-spacing:.4px; font-weight:600;
    color:var(--ink-soft); background:var(--panel-alt); border:1px solid var(--line); border-radius:4px;
    padding:9px 14px; cursor:pointer; text-transform:none; width:100%;
  }
  .extrato-btn:hover{border-color:var(--gold-dim); color:var(--ink);}
  .extrato-btn.sent{color:#151300; background:var(--gold-bright); border-color:var(--gold-bright);}
  .extrato-btn.sent:hover{background:var(--gold);}
  .extrato-date{font-family:var(--mono); font-size:10px; color:var(--ink-faint); margin-top:5px; text-align:center;}

  .right-col{text-align:right;}
  .right-col .saldo{font-family:var(--display); font-weight:700; font-size:20px; margin-top:2px;}

  .empty{ text-align:center; padding:70px 20px; color:var(--ink-faint); }
  .empty .big{font-family:var(--display); font-size:22px; color:var(--ink); margin-bottom:6px;}

  /* ---------- cadastro de clientes ---------- */
  .cad-item{
    background:var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:14px 18px; margin-bottom:9px; display:flex; justify-content:space-between; align-items:center;
    gap:12px; flex-wrap:wrap; cursor:pointer; transition:border-color .15s;
  }
  .cad-item:hover{border-color:var(--gold-dim);}
  .cad-item-left{display:flex; align-items:center; gap:13px; min-width:0;}
  .cad-avatar{
    width:42px; height:42px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-weight:700; font-size:15px; color:#151300;
  }
  .cad-item .cad-name{font-family:var(--display); font-weight:700; font-size:18px;}
  .cad-item .cad-meta{font-family:var(--mono); font-size:11px; color:var(--ink-faint); margin-top:3px;}

  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.7);
    display:flex; align-items:flex-start; justify-content:center; padding:40px 16px;
    overflow-y:auto; z-index:50;
  }
  .modal{
    background:var(--panel); border:1px solid var(--gold-dim); border-radius:6px; max-width:480px; width:100%;
    padding:26px 26px 22px; margin-bottom:40px;
  }
  .modal h2{font-family:var(--display); margin:0 0 16px; font-size:24px; font-weight:700; color:var(--ink);}
  .modal .close{
    float:right; background:none; border:none; font-size:22px; cursor:pointer; color:var(--ink-faint);
  }
  .field{margin-top:14px;}
  .field label{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:1px; text-transform:uppercase; font-weight:600; color:var(--ink-faint); margin-bottom:6px;}
  .field input, .field textarea, .field select{
    width:100%; padding:10px 12px; border-radius:4px; border:1px solid var(--line);
    font-family:var(--sans); font-size:14.5px; background:var(--panel-alt); color:var(--ink);
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:none; border-color:var(--gold);}
  .field textarea{resize:vertical; min-height:64px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  .calc-box{
    background:var(--panel-alt); border:1px solid var(--line); border-radius:4px; padding:14px 16px;
    margin-top:16px; display:flex; justify-content:space-between; align-items:center;
  }
  .calc-box .k{font-family:var(--mono); font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-faint);}
  .calc-box .v{font-family:var(--display); font-weight:700; font-size:22px;}

  .modal .actions{margin-top:20px; display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;}

  /* ---------- tela de login ---------- */
  .login-screen{
    position:fixed; inset:0; background:var(--bg); z-index:200;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-card{
    background:var(--panel); border:1px solid var(--gold-dim); border-radius:8px;
    padding:36px 32px; max-width:360px; width:100%; text-align:center;
  }
  .login-logo{font-family:var(--display); font-weight:700; font-size:24px; color:var(--ink); letter-spacing:.5px;}
  .login-logo span{color:var(--gold-bright);}
  .login-sub{font-family:var(--mono); font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-faint); margin:6px 0 24px;}
  .login-card .field{text-align:left;}
  .login-erro{
    background:var(--red-bg); border:1px solid var(--red); color:var(--red); border-radius:4px;
    padding:9px 12px; font-size:12.5px; margin-top:14px;
  }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--gold); color:#151300; padding:10px 18px; border-radius:4px;
    font-size:13.5px; font-weight:600; z-index:100; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  .loading{text-align:center; padding:80px 20px; color:var(--ink-faint); font-family:var(--mono);}
  .err-box{
    background:var(--red-bg); border:1px solid var(--red); color:var(--red); padding:14px 16px;
    border-radius:4px; margin-bottom:16px; font-size:13.5px;
  }

  @media (max-width:760px){
    .list-header{display:none;}
    .client{grid-template-columns:1fr; row-gap:10px;}
    .col-label{display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:4px;}
    .right-col{text-align:left; margin-top:0;}
    .col-extrato{text-align:left;}
    .extrato-btn{width:auto;}
    .row2{grid-template-columns:1fr;}
    .nav-menu{left:0; right:auto;}
  }
</style>
</head>

function monthLabel(m){
  const [y,mm] = m.split('-').map(Number);
  const d = new Date(y, mm-1, 1);
  const txt = d.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
  return txt.charAt(0).toUpperCase()+txt.slice(1);
}
function shiftMonth(m, delta){
  const [y,mm] = m.split('-').map(Number);
  const d = new Date(y, mm-1+delta, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

// retorna a data do Nº dia útil (seg-sex) de um mês/ano — usado pro vencimento (5º dia útil)
function nthDiaUtil(year, monthIndex0, n){
  let count=0, day=1;
  while(true){
    const d = new Date(year, monthIndex0, day);
    if(d.getMonth()!==monthIndex0) return d; // segurança, não deveria chegar aqui
    const dow = d.getDay();
    if(dow!==0 && dow!==6){ count++; if(count===n) return d; }
    day++;
  }
}
function vencimentoDoMes(mesStr){
  const [y,mm] = mesStr.split('-').map(Number);
  return nthDiaUtil(y, mm-1, diaUtilVencimento);
}
function fmtDataObj(d){
  return new Intl.DateTimeFormat('pt-BR').format(d);
}
// data efetiva de vencimento: usa a definida manualmente se existir, senão calcula automático (5º dia útil)
function vencimentoEfetivo(mesStr){
  if(vencimentosManuais[mesStr]) return new Date(vencimentosManuais[mesStr]+'T00:00:00');
  return vencimentoDoMes(mesStr);
}
// valor no formato AAAA-MM-DD, pronto pra um <input type="date">
function vencimentoISO(mesStr){
  const d = vencimentoEfetivo(mesStr);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// anima um número subindo de 0 até o valor final
function countUp(el, target, formatFn, duration, delay){
  if(!el) return;
  setTimeout(()=>{
    const t0 = performance.now();
    function step(now){
      const p = Math.min(1, (now-t0)/duration);
      const eased = 1 - Math.pow(1-p, 3); // ease-out cúbico
      el.textContent = formatFn(target*eased);
      if(p<1) requestAnimationFrame(step); else el.textContent = formatFn(target);
    }
    requestAnimationFrame(step);
  }, delay);
}
function animateCountUps(root){
  root.querySelectorAll('.cu-pct').forEach((el,i)=>{
    countUp(el, parseFloat(el.dataset.target)||0, v=>Math.round(v)+'%', 950, i*90);
  });
  root.querySelectorAll('.cu-brl').forEach((el,i)=>{
    countUp(el, parseFloat(el.dataset.target)||0, v=>fmtBRL(v), 950, i*90);
  });
  root.querySelectorAll('.cu-int').forEach((el,i)=>{
    countUp(el, parseFloat(el.dataset.target)||0, v=>Math.round(v).toString(), 700, i*70);
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function clienteToDb(cli){
  return {
    id: cli.id, nome: cli.nome, cpf_cnpj: cli.cpfCnpj||null, cro: cli.cro||null,
    cidade: cli.cidade||null, estado: cli.estado||null, endereco: cli.endereco||null
  };
}
function clienteFromDb(row){
  return {
    id: row.id, nome: row.nome, cpfCnpj: row.cpf_cnpj||'', cro: row.cro||'',
    cidade: row.cidade||'', estado: row.estado||'', endereco: row.endereco||'',
    createdAt: row.created_at
  };
}
function extratoToDb(ex){
  return {
    id: ex.id, cliente_id: ex.clienteId, mes: ex.mes,
    valor_mes: ex.valorMes||0, valor_pago: ex.valorPago||0,
    extrato_enviado: !!ex.extratoEnviado, extrato_enviado_data: ex.extratoEnviadoData||null,
    comprovante: ex.comprovante || {anexado:false, nota:''},
    pagamentos: ex.pagamentos || [], notas: ex.notas || []
  };
}
function extratoFromDb(row){
  return {
    id: row.id, clienteId: row.cliente_id, mes: row.mes,
    valorMes: Number(row.valor_mes)||0, valorPago: Number(row.valor_pago)||0,
    extratoEnviado: !!row.extrato_enviado, extratoEnviadoData: row.extrato_enviado_data,
    comprovante: row.comprovante || {anexado:false, nota:''},
    pagamentos: row.pagamentos || [], notas: row.notas || [],
    createdAt: row.created_at
  };
}

// ---------------------------------------------------------------
// Salvar dados no Supabase
// ---------------------------------------------------------------
async function saveRegistryClients(){
  try{
    if(registryClients.length>0){
      const {error} = await supa.from('clientes').upsert(registryClients.map(clienteToDb));
      if(error) throw error;
    }
    const idsAtuais = registryClients.map(c=>c.id);
    if(idsAtuais.length>0){
      await supa.from('clientes').delete().not('id','in',`(${idsAtuais.join(',')})`);
    }else{
      await supa.from('clientes').delete().neq('id','00000000-0000-0000-0000-000000000000');
    }
  }catch(e){ showToast('Erro ao salvar clientes: '+(e.message||e)); }
}
async function saveExtratos(){
  try{
    if(extratos.length>0){
      const {error} = await supa.from('extratos').upsert(extratos.map(extratoToDb));
      if(error) throw error;
    }
    const idsAtuais = extratos.map(e=>e.id);
    if(idsAtuais.length>0){
      await supa.from('extratos').delete().not('id','in',`(${idsAtuais.join(',')})`);
    }else{
      await supa.from('extratos').delete().neq('id','00000000-0000-0000-0000-000000000000');
    }
  }catch(e){ showToast('Erro ao salvar extratos: '+(e.message||e)); }
}

  const { data } = await supa.auth.getSession();
  isLoggedIn = !!(data && data.session);
  currentSupaUser = (data && data.session && data.session.user) || null;
}

function showLoginScreen(){
  const tela = document.getElementById('loginScreen');
  const app = document.getElementById('app');
  if(tela) tela.style.display = 'flex';
  if(app) app.style.display = 'none';
  const erro = document.getElementById('loginErro');
  if(erro) erro.style.display = 'none';
  const u = document.getElementById('loginUsuario');
  if(u){ u.value=''; u.focus(); }
  const s = document.getElementById('loginSenha');
  if(s) s.value = '';
}
function hideLoginScreen(){
  const tela = document.getElementById('loginScreen');
  const app = document.getElementById('app');
  if(tela) tela.style.display = 'none';
  if(app) app.style.display = 'block';
}

async function tentarLogin(){
  const email = (document.getElementById('loginUsuario')?.value || '').trim();
  const senha = document.getElementById('loginSenha')?.value || '';
  const erro = document.getElementById('loginErro');
  const btn = document.getElementById('btnEntrar');
  if(btn) btn.disabled = true;
  const { data, error } = await supa.auth.signInWithPassword({ email, password: senha });
  if(btn) btn.disabled = false;
  if(error){
    if(erro){ erro.textContent = 'E-mail ou senha incorretos.'; erro.style.display = 'block'; }
    return;
  }
  isLoggedIn = true;
  currentSupaUser = (data && data.user) || null;
  hideLoginScreen();
  loadData();
}
async function fazerLogout(){
  await supa.auth.signOut();
  isLoggedIn = false;
  currentSupaUser = null;
  showLoginScreen();
}

function initLoginScreen(){
  on('btnEntrar','onclick', tentarLogin);
  const s = document.getElementById('loginSenha');
  if(s) s.addEventListener('keydown', (e)=>{ if(e.key==='Enter') tentarLogin(); });
  const u = document.getElementById('loginUsuario');
  if(u) u.addEventListener('keydown', (e)=>{ if(e.key==='Enter') document.getElementById('loginSenha')?.focus(); });
}

async function loadData(){
  loading = true; render();
  try{
    const { data: rc, error: e1 } = await supa.from('clientes').select('*').order('nome');
    if(e1) throw e1;
    registryClients = (rc||[]).map(clienteFromDb);

    const { data: re, error: e2 } = await supa.from('extratos').select('*');
    if(e2) throw e2;
    extratos = (re||[]).map(extratoFromDb);

    const { data: cfg } = await supa.from('config').select('*');
    if(cfg){
      const dU = cfg.find(c=>c.chave==='diaUtilVencimento');
      const vM = cfg.find(c=>c.chave==='vencimentosManuais');
      if(dU && dU.valor) diaUtilVencimento = dU.valor;
      if(vM && vM.valor) vencimentosManuais = vM.valor;
    }

    loadError = null;
  }catch(e){
    registryClients = []; extratos = [];
    loadError = 'Não foi possível carregar os dados do Supabase: '+(e.message||e);
  }
  loading = false;
  render();
}

// ---------------------------------------------------------------
// Cálculos
// ---------------------------------------------------------------
function clientCalc(ex){
  const valorMes = Number(ex.valorMes||0);
  const valorPago = Number(ex.valorPago||0);
  const aPagar = Math.max(0, valorMes - valorPago);
  let status;
  if(aPagar<=0 && valorMes>0) status='quitado';
  else if(valorPago>0) status='parcial';
  else status='pendente';
  return {valorMes, valorPago, aPagar, status};
}
// quantos dias esse extrato está em atraso (comparado ao vencimento do mês). 0 se já quitado ou ainda no prazo.
function diasAtraso(ex){
  const s = clientCalc(ex);
  if(s.status==='quitado') return 0;
  const due = vencimentoEfetivo(ex.mes);
  const hoje = new Date(todayStr()+'T00:00:00');
  const diff = Math.round((hoje - due) / 86400000);
  return diff>0 ? diff : 0;
}
function nomeDoCliente(clienteId){
  const cli = registryClients.find(c=>c.id===clienteId);
  return cli ? cli.nome : '(cliente removido)';
}

// ---------------------------------------------------------------
// Menu / navegação (roteamento por # na URL, permitindo links reais)
// ---------------------------------------------------------------
function hashToView(hash){
  const h = (hash||'').replace('#','');
  if(h==='visualizacao') return 'visualizacao';
  if(h==='cadastro') return 'cadastro';
  if(h==='conta') return 'conta';
  return 'financeiro'; // '#administrador' ou vazio
}

function initHeader(){
  const hb = document.getElementById('hamburgerBtn');
  const menu = document.getElementById('navMenu');
  if(hb) hb.onclick = (e)=>{ e.stopPropagation(); menu.classList.toggle('open'); };
  document.addEventListener('click', (e)=>{
    if(menu && !menu.contains(e.target) && e.target!==hb){ menu.classList.remove('open'); }
  });
  ['navFinanceiro','navVisualizacao','navCadastro','navConta'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('click', ()=>{ menu.classList.remove('open'); });
  });
  on('navSair','onclick', ()=>{ menu.classList.remove('open'); fazerLogout(); });
  window.addEventListener('hashchange', ()=>{
    currentView = hashToView(location.hash);
    updateNav();
    render();
  });
  currentView = hashToView(location.hash);
  updateNav();
}
function updateNav(){
  const nf = document.getElementById('navFinanceiro');
  const nv = document.getElementById('navVisualizacao');
  const nc = document.getElementById('navCadastro');
  const na = document.getElementById('navConta');
  const sub = document.getElementById('pageSubtitle');
  if(nf) nf.classList.toggle('active', currentView==='financeiro');
  if(nv) nv.classList.toggle('active', currentView==='visualizacao');
  if(nc) nc.classList.toggle('active', currentView==='cadastro');

function render(){
  const main = document.getElementById('main');

// ---------------------------------------------------------------
// Rankings (valor em pódio + pontualidade em Bons Pagadores / Atrasados)
// ---------------------------------------------------------------
const MEDALS = ['🥇','🥈','🥉'];

function calcPontualidade(){
  const porCliente = {};
  extratos.forEach(exx=>{
    if(!exx.pagamentos || exx.pagamentos.length===0) return;
    const sx = clientCalc(exx);
    if(sx.status!=='quitado') return;
    const due = vencimentoEfetivo(exx.mes);
    const dataConclusao = exx.pagamentos.slice().sort((a,b)=>a.data.localeCompare(b.data)).pop().data;
    const diffDias = Math.round((new Date(dataConclusao+'T00:00:00') - due) / 86400000);
    if(!porCliente[exx.clienteId]) porCliente[exx.clienteId] = {soma:0, qtd:0};
    porCliente[exx.clienteId].soma += diffDias;
    porCliente[exx.clienteId].qtd += 1;
  });
  return Object.entries(porCliente)
    .map(([clienteId, v])=>({clienteId, media: v.soma/v.qtd, qtd: v.qtd}))
    .sort((a,b)=> a.media - b.media);
}

function rankingValorPodioHtml(monthExtratos){
  const ranking = monthExtratos.slice().sort((a,b)=> b.valorMes - a.valorMes);
  if(ranking.length===0) return `<div class="rank-empty" style="padding:0 18px 14px;">Nenhum extrato lançado neste mês.</div>`;

  const top3 = ranking.slice(0,3);
  const resto = ranking.slice(3);

  const cardsHtml = top3.map((ex,i)=>{
    const nome = nomeDoCliente(ex.clienteId);
    const s = clientCalc(ex);
    const statusTxt = s.status==='quitado' ? 'quitado' : s.status==='parcial' ? 'parcial' : 'pendente';
    return `
      <div class="rank-card">
        <div class="rc-place"><span class="medal">${MEDALS[i]}</span>${i+1}º lugar</div>
        <div class="rc-name">${escapeHtml(nome)}</div>
        <div class="rc-value">${fmtBRL(ex.valorMes)}</div>
        <div class="rc-sub">${fmtBRL(s.valorPago)} pago · ${statusTxt}</div>
      </div>`;
  }).join('');

  const restoHtml = resto.length===0 ? '' : `
    <div class="ranking-list" style="padding-top:0;">
      ${resto.map((ex,i)=>{
        const nome = nomeDoCliente(ex.clienteId);
        return `
          <div class="rank-row">
            <span class="rank-pos">${i+4}º</span>
            <div class="rank-avatar" style="background:${avatarColor(ex.clienteId)}">${initials(nome)}</div>
            <div class="rank-name">${escapeHtml(nome)}</div>
            <div class="rank-value">${fmtBRL(ex.valorMes)}</div>
          </div>`;
      }).join('')}
    </div>`;

  return `<div class="rank-cards-row">${cardsHtml}</div>${restoHtml}`;
}

function pontualidadeSplitHtml(monthExtratos){
  const pontualidadeRanking = calcPontualidade();
  const bons = pontualidadeRanking.filter(r=>r.media<=0).slice(0,8);

  const atrasadosMes = monthExtratos
    .map(ex=>({ex, dias: diasAtraso(ex)}))
    .filter(o=>o.dias>0)
    .sort((a,b)=> b.dias - a.dias);

  const bonsHtml = bons.length===0
    ? `<div class="rank-empty">Ainda não há pagamentos quitados suficientes.</div>`
    : bons.map((r,i)=>{
        const nome = nomeDoCliente(r.clienteId);
        const diasAbs = Math.round(Math.abs(r.media));
        const txt = diasAbs===0 ? 'no dia' : `${diasAbs} dia${diasAbs===1?'':'s'} antes`;
        return `
          <div class="rank-mini-row">
            <div class="rank-mini-left">
              <span class="rank-mini-pos">${i<3?MEDALS[i]:(i+1)+'º'}</span>
              <div>
                <div class="rank-mini-name">${escapeHtml(nome)}</div>
              </div>
            </div>
            <span class="rank-mini-badge green">${txt}</span>
          </div>`;
      }).join('');

  const atrasadosHtml = atrasadosMes.length===0
    ? `<div class="rank-empty">Nenhum atraso neste mês. 🎉</div>`
    : atrasadosMes.map(({ex,dias})=>{
        const nome = nomeDoCliente(ex.clienteId);
        return `
          <div class="rank-mini-row">
            <div class="rank-mini-left">
              <div class="rank-avatar" style="width:26px;height:26px;font-size:10px;background:${avatarColor(ex.clienteId)}">${initials(nome)}</div>
              <div class="rank-mini-name">${escapeHtml(nome)}</div>
            </div>
            <span class="rank-mini-badge red">${dias} dia${dias===1?'':'s'} atraso</span>
          </div>`;
      }).join('');

  return `
    <div class="two-col-rank">
      <div>
        <div class="rank-col-title">🏆 Bons pagadores</div>
        <div class="rank-col-box">${bonsHtml}</div>
      </div>
      <div>
        <div class="rank-col-title">⏰ Atrasados neste mês</div>
        <div class="rank-col-box">${atrasadosHtml}</div>
      </div>
    </div>`;
}

    <svg width="120" height="120" viewBox="0 0 120 120">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--red-bg)" stroke-width="14"></circle>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--red)" stroke-width="14"
        stroke-dasharray="${circ}" stroke-dashoffset="0" opacity="0.55"
        transform="rotate(-90 ${cx} ${cy})"></circle>
      <circle class="donut-arc" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--green)" stroke-width="14"
        stroke-linecap="butt" stroke-dasharray="0 ${circ}" stroke-dashoffset="0" data-target="${goldLen} ${circ}"
        transform="rotate(-90 ${cx} ${cy})"></circle>
      <text class="donut-pct-text cu-pct" data-target="${pctPago}" x="${cx}" y="${cy-2}" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="26" fill="var(--ink)">0%</text>
      <text x="${cx}" y="${cy+16}" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1" fill="var(--ink-faint)">RECEBIDO</text>
    </svg>
  `;

  const detailHtml = readonly
    ? detailPanelHtml(filtered.find(e=>e.id===selectedExtratoId) || null, true)
    : (selectedExtratoId==='new' ? detailPanelCreateHtml() : detailPanelHtml(filtered.find(e=>e.id===selectedExtratoId) || null, false));

  main.innerHTML = `
    ${loadError ? `<div class="err-box">${loadError}</div>` : ''}
    ${readonly ? `<div class="page-title" style="margin-bottom:14px;"><p>Modo visualização — só para consulta. Para editar, cadastrar ou lançar extratos, use o menu e vá em "Administrador".</p></div>` : ''}

    <div class="month-bar">
      <button type="button" class="month-arrow" id="prevMonth">‹</button>
      <div class="month-input-wrap">
        <button type="button" class="month-label-btn" id="monthLabelBtn">${monthLabel(selectedMonth)}</button>
        <input type="month" id="monthPicker" value="${selectedMonth}">
      </div>
      <button type="button" class="month-arrow" id="nextMonth">›</button>
      <div class="vencimento-badge">
        📅 Vencimento: <input type="date" id="vencimentoManualInput" value="${vencimentoISO(selectedMonth)}">
        ${vencimentosManuais[selectedMonth]
          ? `<button type="button" class="btn ghost small" id="resetVencimento" style="padding:4px 9px; font-size:10px;">↺ Automático</button>`
          : `<span style="color:var(--ink-faint); font-size:10px;">(${diaUtilVencimento}º dia útil, automático)</span>`}
      </div>
    </div>

    <div class="summary-panel">
      <div class="donut-block">
        ${donutSvg}
        <div class="donut-legend">
          <div class="legend-line recebido"><span class="dot green"></span>Recebido <span class="amt"><span class="cu-pct" data-target="${pctPago}">0%</span> · <span class="cu-brl" data-target="${totalRecebido}">R$ 0,00</span></span></div>
          <div class="legend-line receber"><span class="dot red"></span>A receber <span class="amt"><span class="cu-pct" data-target="${pctReceber}">0%</span> · <span class="cu-brl" data-target="${totalReceber}">R$ 0,00</span></span></div>
        </div>
      </div>
      <div class="counters">
        <div class="counter"><div class="cnum cu-int" data-target="${monthExtratos.length}">0</div><div class="clabel">Clientes no mês</div></div>
        <div class="counter"><div class="cnum cu-pct" style="color:var(--blue);" data-target="${pctPago}">0%</div><div class="clabel">Pago do mês</div></div>
        <div class="counter"><div class="cnum cu-int" style="color:var(--green);" data-target="${qtdQuitado}">0</div><div class="clabel">Pagaram total</div></div>
        <div class="counter"><div class="cnum cu-int" style="color:var(--gold-bright);" data-target="${qtdParcial}">0</div><div class="clabel">Pagaram parcial</div></div>
        <div class="counter faltam"><div class="cnum cu-int" data-target="${qtdPendente}">0</div><div class="clabel">Nenhum pagamento</div></div>
      </div>
    </div>

    <div class="ranking-panel">
      <button type="button" class="ranking-toggle" id="toggleRanking">
        <span>🏆 Ranking do mês <span style="color:var(--gold-bright);">(por valor faturado)</span></span>
        <span class="chevron">${rankingOpen?'▲':'▼'}</span>
      </button>
      ${rankingOpen ? rankingValorPodioHtml(monthExtratos) : ''}
    </div>

    <div class="ranking-panel">
      <button type="button" class="ranking-toggle" id="toggleRankingPontual">
        <span>🎖️ Pontualidade — vencimento ${fmtDataObj(vencimentoEfetivo(selectedMonth))}</span>
        <span class="chevron">${rankingPontualOpen?'▲':'▼'}</span>
      </button>
      ${rankingPontualOpen ? pontualidadeSplitHtml(monthExtratos) : ''}
    </div>

    <div class="two-pane">
      <div class="pane-list">
        <div class="toolbar">
          <input type="search" id="search" placeholder="Buscar cliente…" value="${searchTerm.replace(/"/g,'&quot;')}">
          ${readonly ? '' : '<button type="button" class="btn small" id="btnNovoExtrato">+ Novo</button>'}
        </div>
        <div class="toolbar tabs">
          ${tabs.map(([k,l])=>`<div class="tab ${filterTab===k?'active':''}" data-tab="${k}">${l}</div>`).join('')}
        </div>
        <div class="mini-list">
          ${filtered.length===0 ? `
            <div class="empty" style="padding:40px 12px;">
              <div class="big" style="font-size:17px;">${monthExtratos.length===0 ? 'Nenhum extrato' : 'Nada por aqui'}</div>
              <div style="font-size:12.5px;">${monthExtratos.length===0 ? (readonly?'Nada lançado para '+monthLabel(selectedMonth).toLowerCase()+'.':'Clique em "+ Novo" para começar.') : 'Ajuste a busca ou o filtro.'}</div>
            </div>` : filtered.map(e=>miniRowHtml(e, e.id===selectedExtratoId)).join('')}
        </div>
      </div>
      <div id="paneDetail">${detailHtml}</div>
    </div>
  `;

  // anima o arco do gráfico de rosca crescendo do zero até o valor real
  requestAnimationFrame(()=>{
    const arc = main.querySelector('.donut-arc');
    if(arc && arc.dataset.target) arc.setAttribute('stroke-dasharray', arc.dataset.target);
  });
  animateCountUps(main);

  on('toggleRanking','onclick', ()=>{ rankingOpen = !rankingOpen; render(); });
  on('toggleRankingPontual','onclick', ()=>{ rankingPontualOpen = !rankingPontualOpen; render(); });
  on('vencimentoManualInput','onchange', async (e)=>{
    const v = e.target.value;
    if(!v){ render(); return; }
    vencimentosManuais[selectedMonth] = v;
    await saveConfig();
    showToast('Vencimento deste mês atualizado.');
    render();
  });
  on('resetVencimento','onclick', async ()=>{
    delete vencimentosManuais[selectedMonth];
    await saveConfig();
    showToast('Vencimento voltou a ser automático.');
    render();
  });
  on('prevMonth','onclick', ()=>{ selectedMonth = shiftMonth(selectedMonth,-1); selectedExtratoId=null; panelLocked=true; render(); });
  on('nextMonth','onclick', ()=>{ selectedMonth = shiftMonth(selectedMonth,1); selectedExtratoId=null; panelLocked=true; render(); });
  on('monthLabelBtn','onclick', ()=>{
    const picker = document.getElementById('monthPicker');
    if(picker){ if(picker.showPicker){ try{ picker.showPicker(); }catch(e){ picker.focus(); } } else { picker.focus(); } }
  });
  on('monthPicker','onchange', (e)=>{ if(e.target.value){ selectedMonth = e.target.value; selectedExtratoId=null; panelLocked=true; render(); } });
  on('search','oninput', (e)=>{ searchTerm = e.target.value; renderListOnly(); });
  document.querySelectorAll('.tab').forEach(el=>{ el.onclick = ()=>{ filterTab = el.dataset.tab; render(); }; });
  document.querySelectorAll('.mini-row').forEach(el=>{ el.onclick = ()=>{ if(el.dataset.id!==selectedExtratoId){ panelLocked=true; } selectedExtratoId = el.dataset.id; render(); }; });
  document.querySelectorAll('.ver-comprovante').forEach(link=>{
    link.onclick = (e)=>{
      e.preventDefault(); e.stopPropagation();
      const allExtratos = extratos; // busca em todos, já que o painel pode estar mostrando qualquer um
      let pag = null;
      for(const exx of allExtratos){ pag = (exx.pagamentos||[]).find(p=>p.id===link.dataset.pagid); if(pag) break; }
      if(pag && pag.comprovante && pag.comprovante.dataUrl){
        const w = window.open();
        if(w){ w.document.write(`<title>Comprovante</title><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;">${pag.comprovante.tipo && pag.comprovante.tipo.includes('pdf') ? `<embed src="${pag.comprovante.dataUrl}" width="100%" height="100%" style="min-height:100vh;">` : `<img src="${pag.comprovante.dataUrl}" style="max-width:100%;max-height:100vh;">`}</body>`); }
      }
    };
  });

  if(readonly) return;

  on('btnNovoExtrato','onclick', ()=>{ selectedExtratoId='new'; panelLocked=true; render(); });
  bindDetailPanelEvents();
}

function renderListOnly(){
  render();
  const s = document.getElementById('search');
  if(s){ s.focus(); s.selectionStart = s.selectionEnd = searchTerm.length; }
}

function miniRowHtml(ex, selected){
  const s = clientCalc(ex);
  const cli = registryClients.find(c=>c.id===ex.clienteId);
  const nome = cli ? cli.nome : '(cliente removido)';
  const local = cli ? [cli.cidade, cli.estado].filter(Boolean).join('/') : '';
  const enviado = !!ex.extratoEnviado;
  const quitado = s.status==='quitado';
  const comprovanteAnexado = !!(ex.comprovante && ex.comprovante.anexado)
    || (Array.isArray(ex.pagamentos) && ex.pagamentos.some(p=>p.comprovante && p.comprovante.anexado));
  const atraso = diasAtraso(ex);
  return `
    <div class="mini-row ${selected?'selected':''}" data-id="${ex.id}">
      <div class="mini-row-top">
        <div class="mini-avatar" style="background:${avatarColor(ex.clienteId)}">${initials(nome)}</div>
        <div class="mini-info">
          <div class="mini-name">${escapeHtml(nome)}</div>
          ${local ? `<div class="mini-sub">${escapeHtml(local)}</div>` : ''}
          <div class="mini-badges">
            <span class="mini-badge ${enviado?'on':''}">${enviado?'✓ ':''}Enviado</span>
            <span class="mini-badge ${quitado?'on':''}">${quitado?'✓ ':''}Quitado</span>
            <span class="mini-badge ${comprovanteAnexado?'on-blue':''}">${comprovanteAnexado?'📎 ':''}Comprovante</span>
          </div>
        </div>
        ${atraso>0 ? `<div class="mini-atraso">⏰ ${atraso}d atraso</div>` : ''}
      </div>
      <div class="mini-values-row">
        <span>Mês <b style="color:var(--green);">${fmtBRL(s.valorMes)}</b></span>
        <span>Pago <b style="color:var(--gold-bright);">${fmtBRL(s.valorPago)}</b></span>
        <span>Rest <b style="color:var(--red);">${fmtBRL(s.aPagar)}</b></span>
      </div>
    </div>
  `;
}

function ensureExtratoDefaults(ex){
  if(!ex.pagamentos) ex.pagamentos = [];
  if(!ex.comprovante) ex.comprovante = {anexado:false, nota:'', data:null};
  if(!ex.notas){
    ex.notas = (ex.observacoes && ex.observacoes.trim())
      ? [{id:uid(), data: ex.createdAt || todayStr(), texto: ex.observacoes.trim()}]
      : [];
  }
  return ex;
}

function notaRowHtml(n, showDelete){
  return `
    <div class="pagamento-row">
      <div><div class="d" style="font-family:var(--mono); font-size:11px; color:var(--ink-faint);">${fmtDate(n.data)}</div><div style="font-size:13.5px; color:var(--ink-soft); margin-top:2px;">${escapeHtml(n.texto)}</div></div>
      ${showDelete ? `<button type="button" data-notaid="${n.id}" ${panelLocked?'disabled':''}>Excluir</button>` : ''}
    </div>`;
}

function pagamentoRowHtml(p, showDelete){
  const temComprovante = p.comprovante && p.comprovante.anexado;
  const temArquivo = temComprovante && p.comprovante.dataUrl;
  const valColor = temComprovante ? 'var(--blue)' : 'var(--gold-bright)';
  const clipe = temComprovante ? ' 📎' : '';
  const forma = p.formaPagamento ? p.formaPagamento+' · ' : '';
  const notaExtra = temComprovante && p.comprovante.nota ? ' · '+escapeHtml(p.comprovante.nota) : '';
  const linkVer = temArquivo ? ` · <a href="#" class="ver-comprovante" data-pagid="${p.id}" style="color:var(--blue);">ver comprovante</a>` : '';
  return `
    <div class="pagamento-row">
      <div><div class="val" style="color:${valColor};">${fmtBRL(p.valor)}${clipe}</div><div class="d">${forma}${fmtDate(p.data)}${p.obs?' · '+escapeHtml(p.obs):''}${notaExtra}${linkVer}</div></div>
      ${showDelete ? `<button type="button" data-pagid="${p.id}" ${panelLocked?'disabled':''}>Excluir</button>` : ''}
    </div>`;
}

function openNotaForm(ex){
  const existing = document.querySelector('.overlay');
  if(existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <button type="button" class="close" id="tClose">×</button>
      <h2>Adicionar observação</h2>
      <div class="field"><label>Data *</label><input id="tData" type="date" value="${todayStr()}"></div>
      <div class="field"><label>Observação *</label><textarea id="tTexto" placeholder="Ex: Disse que vai pagar dia 15, aguardando pagamento do plano..."></textarea></div>
      <div class="actions">
        <button type="button" class="btn ghost" id="tCancel">Cancelar</button>
        <button type="button" class="btn" id="tSave">Adicionar</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  const close = ()=> overlay.remove();
  onIn(overlay,'tClose','onclick', close);
  onIn(overlay,'tCancel','onclick', close);
  onIn(overlay,'tSave','onclick', async ()=>{
    const data = overlay.querySelector('#tData')?.value || todayStr();
    const texto = (overlay.querySelector('#tTexto')?.value || '').trim();
    if(!texto){ showToast('Escreva a observação.'); return; }
    ex.notas.push({id:uid(), data, texto});
    await saveExtratos();
    showToast('Observação adicionada.');
    close();
    render();
  });
}

function openPagamentoForm(ex){
  const existing = document.querySelector('.overlay');
  if(existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <button type="button" class="close" id="pClose">×</button>
      <h2>Adicionar pagamento</h2>
      <div class="field">
        <label>Forma de pagamento *</label>
        <select id="pForma">
          <option value="Pix">Pix</option>
          <option value="Boleto">Boleto</option>
          <option value="Cartão">Cartão</option>
        </select>
      </div>
      <div class="row2">
        <div class="field"><label>Valor (R$) *</label><input id="pValor" type="number" step="0.01" min="0.01"></div>
        <div class="field"><label>Data *</label><input id="pData" type="date" value="${todayStr()}"></div>
      </div>
      <div class="field"><label>Observação (opcional)</label><input id="pObs" placeholder="Ex: primeira parcela"></div>
      <div class="field">
        <label>Comprovante (opcional)</label>
        <input id="pComprovante" type="file" accept="image/*,application/pdf">
        <div id="pComprovanteInfo" style="font-family:var(--mono); font-size:11px; color:var(--ink-faint); margin-top:6px;"></div>
      </div>
      <div class="actions">
        <button type="button" class="btn ghost" id="pCancel">Cancelar</button>
        <button type="button" class="btn" id="pSave">Adicionar</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  const close = ()=> overlay.remove();
  onIn(overlay,'pClose','onclick', close);
  onIn(overlay,'pCancel','onclick', close);

  let comprovanteData = null; // {nome, tipo, dataUrl}
  const MAX_BYTES = 600*1024; // ~600KB por comprovante

  overlay.querySelector('#pComprovante')?.addEventListener('change', (e)=>{
    const file = e.target.files && e.target.files[0];
    const info = overlay.querySelector('#pComprovanteInfo');
    if(!file){ comprovanteData = null; if(info) info.textContent=''; return; }
    if(file.size > MAX_BYTES){
      showToast('Arquivo muito grande (máx. ~600KB). Escolha uma imagem menor ou comprima o PDF.');
      e.target.value = '';
      comprovanteData = null;
      if(info) info.textContent = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = ()=>{
      comprovanteData = { nome: file.name, tipo: file.type, dataUrl: reader.result };
      if(info) info.textContent = '✓ '+file.name+' pronto para anexar';
    };
    reader.onerror = ()=>{
      showToast('Não foi possível ler o arquivo.');
      comprovanteData = null;
    };
    reader.readAsDataURL(file);
  });

  onIn(overlay,'pSave','onclick', async ()=>{
    const forma = overlay.querySelector('#pForma')?.value || 'Pix';
    const valor = parseFloat(overlay.querySelector('#pValor')?.value);
    const data = overlay.querySelector('#pData')?.value || todayStr();
    const obs = (overlay.querySelector('#pObs')?.value || '').trim();
    if(isNaN(valor) || valor<=0){ showToast('Informe um valor válido.'); return; }
    if(!data){ showToast('Informe a data do pagamento.'); return; }
    ex.pagamentos.push({
      id: uid(), valor, data, obs, formaPagamento: forma,
      comprovante: comprovanteData
        ? { anexado:true, nome: comprovanteData.nome, tipo: comprovanteData.tipo, dataUrl: comprovanteData.dataUrl, nota:'' }
        : { anexado:false, nota:'' }
    });
    ex.valorPago = Number(ex.valorPago||0) + valor;
    await saveExtratos();
    showToast('Pagamento adicionado.');
    close();
    render();
  });
}

function detailPanelHtml(ex, readonly){
  if(!ex){
    return `
      <div class="detail-panel">
        <div class="detail-empty">
          <div style="font-family:var(--display);font-size:20px;color:var(--ink);margin-bottom:6px;">Nenhum extrato selecionado</div>
          <div>${readonly ? 'Escolha um cliente na lista ao lado.' : 'Escolha um cliente na lista ao lado, ou clique em "+ Novo".'}</div>
        </div>
      </div>`;
  }
  ensureExtratoDefaults(ex);
  const s = clientCalc(ex);
  const cli = registryClients.find(c=>c.id===ex.clienteId);
  const nome = cli ? cli.nome : '(cliente removido)';
  const local = cli ? [cli.cidade, cli.estado].filter(Boolean).join(' / ') : '';
  const labels = {quitado:'Quitado', parcial:'Parcial', pendente:'Pendente'};
  const qtdComprovantes = (ex.comprovante && ex.comprovante.anexado ? 1 : 0) + ex.pagamentos.filter(p=>p.comprovante && p.comprovante.anexado).length;
  const atraso = diasAtraso(ex);

  const infoParts = [];
  if(cli && cli.cpfCnpj) infoParts.push('CPF/CNPJ: '+cli.cpfCnpj);
  if(cli && cli.cro) infoParts.push('CRO: '+cli.cro);
  if(local) infoParts.push(local);

  if(readonly){
    const pagamentosHtml = ex.pagamentos.length
      ? ex.pagamentos.slice().sort((a,b)=>b.data.localeCompare(a.data)).map(p=>pagamentoRowHtml(p, false)).join('')
      : `<div class="empty-hist">Nenhum pagamento lançado no histórico ainda.</div>`;
    return `
      <div class="detail-panel">
        <div class="detail-header">
          <div class="detail-avatar" style="background:${avatarColor(ex.clienteId)}">${initials(nome)}</div>
          <div>
            <div class="detail-name">${escapeHtml(nome)}</div>
            <div class="detail-sub">${infoParts.map(escapeHtml).join(' · ') || '—'}</div>
          </div>
          <div style="margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
            <span class="stamp ${s.status}">${labels[s.status]}</span>
            ${atraso>0 ? `<div class="atraso-badge">⏰ ${atraso} dia${atraso===1?'':'s'} de atraso</div>` : ''}
          </div>
        </div>
        <div class="ruler" style="margin:16px 0;"></div>
        <div class="row2">
          <div class="field"><label>Valor do mês</label><div style="font-family:var(--mono);font-size:16px;">${fmtBRL(s.valorMes)}</div></div>
          <div class="field"><label>Valor pago</label><div style="font-family:var(--mono);font-size:16px;color:var(--gold-bright);">${fmtBRL(s.valorPago)}</div></div>
        </div>
        <div class="calc-box" style="margin-top:16px;"><span class="k">Restante</span><span class="v" style="color:${s.aPagar>0?'var(--red)':'var(--gold-bright)'}">${fmtBRL(s.aPagar)}</span></div>
        <h3 class="section-label">Motivo / Observação</h3>
        <div class="pagamentos-list">${ex.notas.length ? ex.notas.slice().sort((a,b)=>b.data.localeCompare(a.data)).map(n=>notaRowHtml(n,false)).join('') : `<div class="empty-hist">Nenhuma observação registrada ainda.</div>`}</div>
        <h3 class="section-label">Histórico de pagamentos</h3>
        <div class="pagamentos-list">${pagamentosHtml}</div>
        <div class="field" style="margin-top:18px;"><label>Extrato enviado</label><div style="font-size:14px;">${ex.extratoEnviado?'✓ Enviado em '+fmtDate(ex.extratoEnviadoData):'Não enviado'}</div></div>
      </div>
    `;
  }

  const pagamentosHtml = ex.pagamentos.length
    ? ex.pagamentos.slice().sort((a,b)=>b.data.localeCompare(a.data)).map(p=>pagamentoRowHtml(p, true)).join('')
    : `<div class="empty-hist">Nenhum pagamento lançado no histórico ainda.</div>`;

  const dis = panelLocked ? 'disabled' : '';

  return `
    <div class="detail-panel">
      <div class="detail-header">
        <div class="detail-avatar" style="background:${avatarColor(ex.clienteId)}">${initials(nome)}</div>
        <div>
          <div class="detail-name">${escapeHtml(nome)}</div>
          <div class="detail-sub">${infoParts.map(escapeHtml).join(' · ') || '—'}</div>
        </div>
        <div style="margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
          <span class="stamp ${s.status}">${labels[s.status]}</span>
          ${atraso>0 ? `<div class="atraso-badge">⏰ ${atraso} dia${atraso===1?'':'s'} de atraso</div>` : ''}
        </div>
      </div>

      <div class="lock-row">
        <button type="button" class="btn ghost small" id="dLock">${panelLocked?'🔒 Destravar edição':'🔓 Travar edição'}</button>
      </div>

        <tr><td>Valor pago</td><td>${fmtBRL(s.valorPago)}</td></tr>

}

function bindDetailPanelEvents(){
  const panel = document.getElementById('paneDetail');
  if(!panel) return;

  // modo criação
  if(selectedExtratoId==='new'){
    if(registryClients.length===0){ return; }
    const recalcNew = ()=>{
      const vm = parseFloat(panel.querySelector('#nValorMes')?.value)||0;
      const ap = Math.max(0, vm);
      const elR = panel.querySelector('#nRestante');
      if(elR){ elR.textContent = fmtBRL(ap); elR.style.color = ap>0 ? 'var(--red)' : 'var(--gold-bright)'; }
    };
    panel.querySelector('#nValorMes')?.addEventListener('input', recalcNew);
    panel.querySelector('#nCancel')?.addEventListener('click', ()=>{ selectedExtratoId=null; render(); });
    panel.querySelector('#nSave')?.addEventListener('click', async ()=>{
      const clienteId = panel.querySelector('#nCliente')?.value || '';
      const valorMes = parseFloat(panel.querySelector('#nValorMes')?.value);
      const obsInicial = (panel.querySelector('#nObs')?.value || '').trim();
      if(!clienteId){ showToast('Selecione um cliente.'); return; }
      if(isNaN(valorMes) || valorMes<0){ showToast('Informe o valor do mês.'); return; }
      const novo = {
        id:uid(), createdAt:todayStr(), mes:selectedMonth, clienteId, valorMes, valorPago:0,
        extratoEnviado:false, extratoEnviadoData:null,
        comprovante:{anexado:false, nota:'', data:null},
        pagamentos:[],
        notas: obsInicial ? [{id:uid(), data:todayStr(), texto:obsInicial}] : []
      };
      extratos.push(novo);
      await saveExtratos();
      showToast('Salvo com sucesso.');
      selectedExtratoId = novo.id;
      panelLocked = true;
      render();
    });
    return;
  }

  // modo edição
  const ex = extratos.find(e=>e.id===selectedExtratoId);
  if(!ex) return;
  ensureExtratoDefaults(ex);

  const recalc = ()=>{
    const vm = parseFloat(panel.querySelector('#dValorMes')?.value)||0;
    const vp = Number(ex.valorPago||0);
    const ap = Math.max(0, vm-vp);
    const elR = panel.querySelector('#dRestante');
    if(elR){ elR.textContent = fmtBRL(ap); elR.style.color = ap>0 ? 'var(--red)' : 'var(--gold-bright)'; }
  };
  panel.querySelector('#dValorMes')?.addEventListener('input', recalc);

  panel.querySelector('#dLock')?.addEventListener('click', ()=>{
    panelLocked = !panelLocked;
    render();
  });

  panel.querySelector('#qaEnviado')?.addEventListener('click', async ()=>{
    ex.extratoEnviado = !ex.extratoEnviado;
    ex.extratoEnviadoData = ex.extratoEnviado ? todayStr() : null;
    await saveExtratos();
    showToast(ex.extratoEnviado ? 'Extrato marcado como enviado.' : 'Extrato enviado desmarcado.');
    render();
  });

  panel.querySelector('#qaQuitado')?.addEventListener('click', async ()=>{
    const s = clientCalc(ex);
    if(s.status==='quitado'){
      if(!confirm('Este extrato já está quitado. Deseja reabrir (zerar o valor pago)?')) return;
      ex.valorPago = 0;
      showToast('Extrato reaberto.');
    }else{
      if(!confirm('Marcar como quitado? O valor pago será igualado ao valor do mês.')) return;
      ex.valorPago = ex.valorMes;
      showToast('Extrato marcado como quitado.');
    }
    await saveExtratos();
    render();
  });

  panel.querySelector('#qaComprovante')?.addEventListener('click', async ()=>{
    const atual = ex.comprovante.nota || '';
    const nota = prompt('Referência ou observação do comprovante (deixe em branco para remover):', atual);
    if(nota===null) return; // cancelou
    ex.comprovante = { anexado: nota.trim().length>0, nota: nota.trim(), data: nota.trim().length>0 ? todayStr() : null };
    await saveExtratos();
    showToast(ex.comprovante.anexado ? 'Comprovante registrado.' : 'Comprovante removido.');
    render();
  });

  panel.querySelector('#qaExtratoMes')?.addEventListener('click', ()=>{
    showToast('Anexar PDF do extrato: essa função entra quando o Supabase for configurado.');
  });

  panel.querySelector('#dAddPagamento')?.addEventListener('click', ()=>{
    openPagamentoForm(ex);
  });

  panel.querySelectorAll('[data-pagid]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const pag = ex.pagamentos.find(p=>p.id===btn.dataset.pagid);
      if(!pag) return;
      if(!confirm('Excluir este pagamento do histórico? O valor pago será reduzido.')) return;
      ex.pagamentos = ex.pagamentos.filter(p=>p.id!==pag.id);
      ex.valorPago = Math.max(0, Number(ex.valorPago||0) - pag.valor);
      await saveExtratos();
      showToast('Pagamento excluído.');
      render();
    });
  });

  panel.querySelector('#dDelete')?.addEventListener('click', async ()=>{
    if(!confirm('Excluir este extrato? Esta ação não pode ser desfeita.')) return;
    extratos = extratos.filter(x=>x.id!==ex.id);
    await saveExtratos();
    showToast('Extrato excluído.');
    selectedExtratoId = null;
    render();
  });

  panel.querySelector('#dSave')?.addEventListener('click', async ()=>{
    const valorMes = parseFloat(panel.querySelector('#dValorMes')?.value);
    if(isNaN(valorMes) || valorMes<0){ showToast('Informe o valor do mês.'); return; }
    ex.valorMes = valorMes;
    await saveExtratos();
    showToast('Salvo com sucesso.');
    render();
  });

  panel.querySelector('#dAddNota')?.addEventListener('click', ()=>{
    openNotaForm(ex);
  });

  panel.querySelectorAll('[data-notaid]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Excluir esta observação do histórico?')) return;
      ex.notas = ex.notas.filter(n=>n.id!==btn.dataset.notaid);
      await saveExtratos();
      showToast('Observação excluída.');
      render();
    });
  });
}

async function criarClientesTeste(){
  const nomes = [
    'Ana Beatriz Souza','Bruno Henrique Lima','Carla Mendes Rocha','Diego Alves Ferreira',
    'Fernanda Costa Silva','Gustavo Ramos Pinto','Isabela Martins Cruz','João Pedro Oliveira',
    'Larissa Nunes Barros','Marcos Vinícius Teixeira'
  ];
  const cidadesEstados = [
    ['São Paulo','SP'],['Rio de Janeiro','RJ'],['Belo Horizonte','MG'],['Curitiba','PR'],
    ['Porto Alegre','RS'],['Salvador','BA'],['Fortaleza','CE'],['Recife','PE'],
    ['Brasília','DF'],['Campinas','SP']
  ];
  const formas = ['Pix','Boleto','Cartão'];
  const notasExemplo = [
    'Disse que vai pagar assim que receber do convênio.',
    'Aguardando repasse da clínica.',
    'Combinado pagamento em duas parcelas.',
    'Pediu para reenviar o extrato por WhatsApp.',
    'Confirmou que já efetuou o pagamento, aguardando comprovante.'
  ];
  const rnd = (min,max)=> Math.floor(Math.random()*(max-min+1))+min;
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];

  const novosClientes = [];
  const novosExtratos = [];
  const mesesTeste = [selectedMonth, shiftMonth(selectedMonth,-1), shiftMonth(selectedMonth,-2)];

  nomes.forEach((nome,i)=>{
    const [cidade, estado] = cidadesEstados[i];
    const cli = {
      id: uid(), createdAt: todayStr(), nome,
      cpfCnpj: `${rnd(100,999)}.${rnd(100,999)}.${rnd(100,999)}-${rnd(10,99)}`,
      cro: `CRO-${estado} ${rnd(10000,99999)}`,
      cidade, estado,
      endereco: `Rua ${pick(['das Flores','Sete de Setembro','Principal','dos Andradas','XV de Novembro'])}, ${rnd(10,999)}`
    };
    novosClientes.push(cli);

    mesesTeste.forEach(mes=>{
      const valorMes = rnd(8,60) * 100; // entre 800 e 6000, múltiplo de 100
      const tipo = pick(['quitado','quitado','parcial','parcial','pendente']); // mais chance de quitado/parcial
      let valorPago = 0;
      const pagamentos = [];
      const [anoM, mesM] = mes.split('-').map(Number);
      const diaPag = String(rnd(1,25)).padStart(2,'0');
      const dataPag = `${anoM}-${String(mesM).padStart(2,'0')}-${diaPag}`;

      if(tipo==='quitado'){
        valorPago = valorMes;
        pagamentos.push({
          id: uid(), valor: valorMes, data: dataPag, obs:'', formaPagamento: pick(formas),
          comprovante: Math.random()<0.6 ? {anexado:true, nota:'comprovante_'+pick(formas).toLowerCase()+'.jpg'} : {anexado:false, nota:''}
        });
      } else if(tipo==='parcial'){
        valorPago = Math.round(valorMes * (rnd(20,70)/100) / 10) * 10;
        pagamentos.push({
          id: uid(), valor: valorPago, data: dataPag, obs: pick(['primeira parcela','sinal',''])  , formaPagamento: pick(formas),
          comprovante: Math.random()<0.4 ? {anexado:true, nota:'comprovante.jpg'} : {anexado:false, nota:''}
        });
      }

      const extratoEnviado = Math.random()<0.7;
      const notas = Math.random()<0.35 ? [{id:uid(), data: dataPag, texto: pick(notasExemplo)}] : [];

      novosExtratos.push({
        id: uid(), createdAt: todayStr(), mes, clienteId: cli.id,
        valorMes, valorPago,
        extratoEnviado, extratoEnviadoData: extratoEnviado ? dataPag : null,
        comprovante: {anexado:false, nota:'', data:null},
        pagamentos, notas
      });
    });
  });

  registryClients = registryClients.concat(novosClientes);
  extratos = extratos.concat(novosExtratos);
  await saveRegistryClients();
  await saveExtratos();
}

  if(!confirm('Isso vai criar 10 clientes de teste com extratos variados (pagos, parciais, pendentes, atrasados). Pode ficar misturado com seus dados reais. Deseja continuar?')) return;
  try{
    await criarClientesTeste();
    showToast('10 clientes de teste criados com sucesso!');
  }catch(e){
    showToast('Erro ao gerar dados de teste: '+(e && e.message ? e.message : e));

}

        </div>` : filtered.map(cl=>cadItemHtml(cl)).join('')}

  on('btnGerarTeste','onclick', gerarDadosTeste);

      const count = extratos.filter(ex=>ex.clienteId===cli.id).length;
      const msg = count>0
        ? `Este cliente tem ${count} extrato(s) lançado(s). Eles serão mantidos, mas ficarão sem cliente vinculado. Deseja excluir mesmo assim?`
        : `Excluir o cliente "${cli.nome}"?`;
      if(!confirm(msg)) return;
      registryClients = registryClients.filter(x=>x.id!==cli.id);
      await saveRegistryClients();
      showToast('Cliente excluído.');
      render();
    };
  });
