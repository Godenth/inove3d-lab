const AVATAR_COLORS = ['#C9A227','#B8863A','#A9762E','#9C8B4E','#8E7434','#C08A3E'];
function initials(nome){
  const parts = (nome||'').trim().split(/\s+/).filter(Boolean);
  if(parts.length===0) return '?';
  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
}
function avatarColor(id){
  let h = 0;
  for(let i=0;i<id.length;i++){ h = (h*31 + id.charCodeAt(i)) % AVATAR_COLORS.length; }
  return AVATAR_COLORS[Math.abs(h)];
}

function cadItemHtml(cl){
  const count = extratos.filter(e=>e.clienteId===cl.id).length;
  const local = [cl.cidade, cl.estado].filter(Boolean).join(' / ');
  const metaParts = [];
  if(local) metaParts.push(local);
  if(cl.cro) metaParts.push('CRO '+cl.cro);
  metaParts.push(count+' extrato'+(count===1?'':'s')+' lançado'+(count===1?'':'s'));
  return `
    <div class="cad-item" data-id="${cl.id}">
      <div class="cad-item-left">
        <div class="cad-avatar" style="background:${avatarColor(cl.id)}">${initials(cl.nome)}</div>
        <div>
          <div class="cad-name">${escapeHtml(cl.nome)}</div>
          <div class="cad-meta">${metaParts.map(escapeHtml).join(' · ')}</div>
        </div>
      </div>
      <button type="button" class="btn danger small" data-del="${cl.id}">Excluir</button>
    </div>
  `;
}

function openClienteForm(clienteId){
  const existing = document.querySelector('.overlay');
  if(existing) existing.remove();
  const cli = clienteId ? registryClients.find(x=>x.id===clienteId) : null;
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:460px;">
      <button type="button" class="close" id="mClose">×</button>
      <h2>${cli?'Editar cliente':'Novo cliente'}</h2>
      <div class="field"><label>Nome do cliente *</label><input id="fNomeCli" value="${cli?escapeHtml(cli.nome):''}"></div>
      <div class="row2">
        <div class="field"><label>CPF / CNPJ</label><input id="fCpfCli" value="${cli?escapeHtml(cli.cpfCnpj||''):''}" placeholder="000.000.000-00"></div>
        <div class="field"><label>CRO</label><input id="fCroCli" value="${cli?escapeHtml(cli.cro||''):''}" placeholder="CRO-SP 00000"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Cidade</label><input id="fCidadeCli" value="${cli?escapeHtml(cli.cidade||''):''}"></div>
        <div class="field"><label>Estado (UF)</label><input id="fEstadoCli" value="${cli?escapeHtml(cli.estado||''):''}" placeholder="SP" maxlength="2" style="text-transform:uppercase;"></div>
      </div>
      <div class="field"><label>Endereço</label><input id="fEnderecoCli" value="${cli?escapeHtml(cli.endereco||''):''}" placeholder="Rua, número, bairro"></div>
      <div class="actions">
        ${cli?'<button type="button" class="btn danger" id="mDelete" style="margin-right:auto;">Excluir</button>':''}
        <button type="button" class="btn ghost" id="mCancel">Cancelar</button>
        <button type="button" class="btn" id="mSave">Salvar</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  const close = ()=> overlay.remove();
  onIn(overlay,'mClose','onclick', close);
  onIn(overlay,'mCancel','onclick', close);

  if(cli){
    onIn(overlay,'mDelete','onclick', async ()=>{
      const count = extratos.filter(e=>e.clienteId===cli.id).length;
      const msg = count>0
        ? `Este cliente tem ${count} extrato(s) lançado(s). Eles serão mantidos, mas ficarão sem cliente vinculado. Deseja excluir mesmo assim?`
        : 'Excluir este cliente?';
      if(!confirm(msg)) return;
      registryClients = registryClients.filter(x=>x.id!==cli.id);
      await saveRegistryClients();
      showToast('Cliente excluído.');
      close(); render();
    });
  }

  onIn(overlay,'mSave','onclick', async ()=>{
    const nomeEl = overlay.querySelector('#fNomeCli');
    const nome = (nomeEl ? nomeEl.value : '').trim();
    if(!nome){ showToast('Informe o nome do cliente.'); return; }
    const data = {
      nome,
      cpfCnpj: (overlay.querySelector('#fCpfCli')?.value || '').trim(),
      cro: (overlay.querySelector('#fCroCli')?.value || '').trim(),
      cidade: (overlay.querySelector('#fCidadeCli')?.value || '').trim(),
      estado: (overlay.querySelector('#fEstadoCli')?.value || '').trim().toUpperCase(),
      endereco: (overlay.querySelector('#fEnderecoCli')?.value || '').trim(),
    };
    if(cli){ Object.assign(cli, data); }
    else{ registryClients.push({id:uid(), createdAt: todayStr(), ...data}); }
    await saveRegistryClients();
    showToast('Salvo com sucesso.');
    close(); render();
  });
}

// ---------------------------------------------------------------
async function initApp(){
  initLoginScreen();
  await loadAuth();
  if(!isLoggedIn){
    showLoginScreen();
    return; // loadData() roda depois do login bem-sucedido
  }
  hideLoginScreen();
  loadData();
}

initHeader();
initApp();
</script>
